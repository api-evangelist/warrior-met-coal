description: Warrior Met Coal is a publicly-traded metallurgical-coal producer
  serving the global steel industry. There is no developer portal, public
  API, or self-service plan; commercial relationships are commodity supply
  contracts. Trimmed scaffold to a single Contact Sales plan because no API
  product surface exists.
