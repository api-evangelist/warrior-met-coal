meters:
  - name: coal_tonnage
    description: Metallurgical coal delivered under the bilateral supply
      contract (out-of-scope for software FinOps; included to give the
      FOCUS row a unit of measure).
    unit: ton
    aggregation: sum
    dimensions:
      - grade
      - port
principles:
  - name: Visibility
    description: Not applicable - commodity-supply settlement is observed
      via the supply contract, not a software billing API.
  - name: Allocation
    description: Not applicable to software FinOps; coal-supply cost is
      allocated by the buyer's metallurgical operations.
  - name: Optimization
    description: Not applicable to software FinOps.
  - name: Accountability
    description: Not applicable to software FinOps; supply contract is
      owned by the buyer's procurement team.
